name: fliplog-preview

services:
  app:
    platform: linux/amd64
    image: fliplog:production
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: production
    init: true
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: http://127.0.0.1:${PREVIEW_PORT:-3188}
    volumes:
      - preview-data:/data
    ports:
      - "127.0.0.1:${PREVIEW_PORT:-3188}:3000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777
      - /app/.next/cache:uid=1000,gid=1000,mode=0755
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('node:http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 15s
      timeout: 15s
      retries: 4
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    restart: "no"

volumes:
  preview-data:
