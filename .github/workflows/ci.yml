name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: environment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Development quality and environment contracts
        run: make check
      - name: Standalone production build and start
        run: make production-up
      - name: Production environment contracts
        run: make production-smoke
      - name: Clean up own environments
        if: always()
        run: |
          make down
          make production-down
