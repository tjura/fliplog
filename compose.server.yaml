name: fliplog-production

services:
  app:
    image: ${APP_IMAGE:?Set the tested AMD64 image tag}
    platform: linux/amd64
    init: true
    env_file: .env.runtime
    environment:
      BETTER_AUTH_URL: https://${APP_HOST:?Set APP_HOST}
    volumes:
      - production-data:/data
    expose: ["3000"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777
      - /app/.next/cache:uid=1000,gid=1000,mode=0755
    networks: [proxy]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:?Set TRAEFIK_NETWORK}
      traefik.http.routers.fliplog.rule: Host(`${APP_HOST:?Set APP_HOST}`)
      traefik.http.routers.fliplog.entrypoints: ${TRAEFIK_HTTPS_ENTRYPOINT:?Set TRAEFIK_HTTPS_ENTRYPOINT}
      traefik.http.routers.fliplog.tls: "true"
      traefik.http.routers.fliplog.tls.certresolver: ${TRAEFIK_CERT_RESOLVER:?Set TRAEFIK_CERT_RESOLVER}
      traefik.http.routers.fliplog.service: fliplog
      traefik.http.services.fliplog.loadbalancer.server.port: "3000"
      traefik.http.routers.fliplog-http.rule: Host(`${APP_HOST:?Set APP_HOST}`)
      traefik.http.routers.fliplog-http.entrypoints: ${TRAEFIK_HTTP_ENTRYPOINT:?Set TRAEFIK_HTTP_ENTRYPOINT}
      traefik.http.routers.fliplog-http.middlewares: fliplog-https
      traefik.http.routers.fliplog-http.service: fliplog
      traefik.http.middlewares.fliplog-https.redirectscheme.scheme: https
      traefik.http.middlewares.fliplog-https.redirectscheme.permanent: "true"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('node:http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    restart: unless-stopped

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:?Set TRAEFIK_NETWORK}

volumes:
  production-data:
