name: fliplog

x-development: &development
  image: fliplog:development
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: development
  init: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  environment:
    NEXT_TELEMETRY_DISABLED: "1"
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
    BETTER_AUTH_URL: http://127.0.0.1:${APP_PORT:-3187}
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "2"

services:
  app:
    <<: *development
    ports:
      - "127.0.0.1:${APP_PORT:-3187}:3000"
    volumes:
      - ./src:/app/src:ro
      - development-data:/data
    command: ["sh", "-c", "node scripts/initialize.mjs && exec npm run dev"]
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1777
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('node:http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: "no"
  tools:
    <<: *development
    profiles: [tools]
    command: ["npm", "run", "check"]
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      SMOKE_BASE_URL: http://app:3000
      SMOKE_ORIGIN: http://127.0.0.1:${APP_PORT:-3187}
      SMOKE_REQUEST_TIMEOUT_MS: "60000"
    restart: "no"

volumes:
  development-data:
